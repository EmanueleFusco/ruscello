# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
# Project license: GPL-3.0-or-later. Only GPL-compatible licenses are allowed.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "The Wry/Tao helper's GTK3 bindings use proc-macro-error as a build-time macro. This is an unmaintained advisory with no reported vulnerability or patched GTK3 release. Revisit when the native backend updates its bindings." },
  { id = "RUSTSEC-2024-0436", reason = "iced 0.14 uses this build-time macro through wgpu's macOS Metal backend. Revisit when iced upgrades wgpu." },
  { id = "RUSTSEC-2026-0192", reason = "iced 0.14 uses this font parser through cosmic-text and winit. Revisit when iced migrates to a maintained font stack." },
  { id = "RUSTSEC-2026-0370", reason = "iced 0.14 uses this D-Bus crate through mundy for Linux system theme detection. Revisit when mundy upgrades to zbus 6." },
  { id = "RUSTSEC-2026-0371", reason = "iced 0.14 uses this D-Bus crate through mundy for Linux system theme detection. Revisit when mundy upgrades to zbus 6." },
  { id = "RUSTSEC-2026-0372", reason = "iced 0.14 uses this D-Bus macro through mundy for Linux system theme detection. Revisit when mundy upgrades to zbus 6." },
  { id = "RUSTSEC-2026-0293", reason = "librqbit 9.1.0 requires librqbit-utp 0.7.0 which uses ringbuf 0.4.8 for u8 byte rings (no Drop panic possible in Consumer::skip/clear) and Ruscello configures ListenerMode::TcpOnly. Revisit when librqbit-utp upgrades ringbuf >= 0.5.2." },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "BSL-1.0",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "GPL-3.0-or-later",
  "GPL-3.0-only",
  "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[[licenses.exceptions]]
# The FSF identifies the Unlicense as GPL-compatible.
# https://www.gnu.org/licenses/license-list.html#Unlicense
allow = ["Unlicense"]
crate = "ksni@0.3.7"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # OpenSSL: use rustls everywhere for portable, static builds.
  { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
