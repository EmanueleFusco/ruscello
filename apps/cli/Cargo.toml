[package]
name = "ruscello-cli"
description = "Headless command-line front-end, also used by crash/resume tests."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "ruscello-cli"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
ruscello-engine.workspace = true
ruscello-platform.workspace = true
tokio = { workspace = true, features = ["fs", "signal"] }
tracing.workspace = true

[dev-dependencies]
ruscello-http.workspace = true
ruscello-testkit.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
