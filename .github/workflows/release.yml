name: Desktop packages

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/**'
      - 'apps/gui/src/updater.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve and validate release version
        shell: bash
        run: |
          version=$(awk '/^\[workspace.package\]/{workspace=1;next} workspace && /^version = /{split($0,a,"\"");print a[2];exit}' Cargo.toml)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"
      - name: Linux build and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          ./scripts/ci-linux-deps.sh
          sudo apt-get install -y --no-install-recommends dpkg-dev libfuse2t64 desktop-file-utils
          desktop-file-validate packaging/linux/ruscello.desktop
          curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          echo "46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1  /tmp/appimagetool" | sha256sum -c -
          chmod +x /tmp/appimagetool
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-release
      - name: Build desktop and browser helper
        run: cargo build --release --locked -p ruscello-gui -p ruscello-webview
      - name: AppImage and Debian
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGETOOL: /tmp/appimagetool
        run: |
          bash packaging/linux/package.sh "$TAG"
          dpkg-deb --contents dist/*.deb
          mkdir -p "$RUNNER_TEMP/appimage"
          image="$(realpath dist/*.AppImage)"
          (cd "$RUNNER_TEMP/appimage"; "$image" --appimage-extract >/dev/null)
          test -x "$RUNNER_TEMP/appimage/squashfs-root/usr/bin/ruscello"
          test -x "$RUNNER_TEMP/appimage/squashfs-root/usr/bin/ruscello-webview"
      - name: Windows NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $bin = (Resolve-Path target/release).Path
          $output = "$(Resolve-Path dist)\ruscello-$env:TAG-windows-x86_64.exe"
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          & $nsis "/DBIN=$bin" "/DOUT=$output" "/DVERSION=$env:VERSION" packaging/windows/ruscello.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $install = "$env:RUNNER_TEMP\Ruscello Package Test"
          $process = Start-Process -FilePath $output -ArgumentList "/S /D=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          foreach ($file in 'ruscello.exe','ruscello-webview.exe','Uninstall.exe') {
            if (!(Test-Path "$install\$file")) { throw "Missing installed file $file" }
          }
      - name: macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash packaging/macos/package.sh "$TAG"
          hdiutil verify dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist
      - name: Publish all assets together
        shell: bash
        run: |
          (cd dist; sha256sum * > SHA256SUMS)
          notes="$RUNNER_TEMP/release-notes.md"
          awk '/^## \[Unreleased\]/{notes=1;next} notes && /^## /{exit} notes{print}' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --latest
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-file "$notes" --latest
          fi
