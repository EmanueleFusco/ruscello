[package]
name = "ruscello-http"
description = "Segmented, resumable, crash-safe HTTP/HTTPS (and later FTP) download engine: probe, segment allocator with work stealing, positional writer, control file, retries, rate limiting, mirrors."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
httpdate.workspace = true
mime_guess.workspace = true
percent-encoding.workspace = true
reqwest = { workspace = true, features = ["rustls", "http2"] }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
proptest.workspace = true
ruscello-testkit.workspace = true

[lints]
workspace = true
