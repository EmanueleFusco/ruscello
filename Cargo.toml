[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["apps/gui"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/EmanueleFusco/ruscello"
authors = ["Emanuele Fusco"]
publish = false

[workspace.dependencies]
# Internal crates
ruscello-core = { path = "crates/core" }
ruscello-http = { path = "crates/http" }
ruscello-torrent = { path = "crates/torrent" }
ruscello-media = { path = "crates/media" }
ruscello-resolver = { path = "crates/resolver" }
ruscello-browser = { path = "crates/browser" }
ruscello-storage = { path = "crates/storage" }
ruscello-engine = { path = "crates/engine" }
ruscello-api = { path = "crates/api" }
ruscello-testkit = { path = "crates/testkit" }
ruscello-platform = { path = "crates/platform" }
# External crates: add here with explicit versions as they are introduced
# (check crates.io for the latest release; see docs/ARCHITECTURE.md for suggestions).
anyhow = "1.0.104"
aes = "0.9.4"
auto-launch = "0.6.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "multipart", "query", "tokio", "ws"] }
bytes = "1.12.1"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bzip2-rs = "0.1.2"
cbc = "0.2.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
cookie = "0.18.2"
crc32fast = "1.5.5"
directories = "6.0.0"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
futures-util = { version = "0.3.34", default-features = false }
fs4 = { version = "1.1.0", default-features = false }
fluent-bundle = "0.16.0"
getrandom = "0.4.3"
hex = "0.4.3"
httpdate = "1.0.3"
infer = { version = "0.22.0", default-features = false }
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "tokio", "canvas", "linux-theme-detection", "x11", "wayland"] }
iced_test = "0.14.0"
keyring = "4.2.0"
librqbit = { version = "9.1.0", default-features = false, features = ["rust-tls"] }
local-ip-address = "0.6.13"
lzma-rs = "0.3.0"
m3u8-rs = "6.0.1"
md-5 = "0.11.0"
mime_guess = "2.0.5"
notify-rust = { version = "4.19.0", default-features = false, features = ["d"] }
open = "5.4.5"
percent-encoding = "2.3.2"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
qrcode = { version = "0.14.1", default-features = false }
quick-xml = "0.41.0"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false }
rfd = "0.18.0"
semver = "1.0.28"
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["aes256", "deflate", "ppmd", "util"] }
rusqlite = { version = "0.42.0", default-features = false, features = ["bundled", "backup", "fallible_uint"] }
rustls = { version = "0.23.46", default-features = false, features = ["logging", "std", "tls12", "aws-lc-rs"] }
rustls-pki-types = "1.14.0"
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
scraper = { version = "0.29.0", default-features = false }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
suppaftp = { version = "12.2.1", default-features = false, features = ["tokio-rustls-aws-lc-rs", "deprecated"] }
sys-locale = "0.3.2"
tao = { version = "0.37.2", default-features = false, features = ["rwh_06"] }
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "tls12", "aws-lc-rs"] }
tokio-tungstenite = "0.29.0"
tokio-util = "0.7.20"
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
winreg = "0.56.0"
windows-sys = "0.61.2"
wry = { version = "0.57.2", default-features = false, features = ["os-webview"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
zip = { version = "9.5.1", default-features = false, features = ["aes-crypto", "deflate", "lzma", "xz"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
large_futures = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
# Optimise dependencies in debug builds: crypto/hashing/torrent code is very slow unoptimised.
opt-level = 2

[profile.dev.build-override]
# Keep build scripts and proc-macros unoptimised so dev/test builds do not spend time optimising macros.
opt-level = 0
