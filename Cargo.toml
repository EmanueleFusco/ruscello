[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["apps/gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/EmanueleFusco/ruscello"
authors = ["Emanuele Fusco"]
publish = false

[workspace.dependencies]
# Internal crates
ruscello-core = { path = "crates/core" }
ruscello-http = { path = "crates/http" }
ruscello-torrent = { path = "crates/torrent" }
ruscello-media = { path = "crates/media" }
ruscello-resolver = { path = "crates/resolver" }
ruscello-browser = { path = "crates/browser" }
ruscello-storage = { path = "crates/storage" }
ruscello-engine = { path = "crates/engine" }
ruscello-api = { path = "crates/api" }
ruscello-testkit = { path = "crates/testkit" }
ruscello-platform = { path = "crates/platform" }
# External crates: add here with explicit versions as they are introduced
# (check crates.io for the latest release; see docs/ARCHITECTURE.md for suggestions).
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
bytes = "1.12.1"
crc32fast = "1.5.5"
directories = "6.0.0"
futures-util = { version = "0.3.34", default-features = false }
httpdate = "1.0.3"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
sys-locale = "0.3.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
large_futures = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
# Optimise dependencies in debug builds: crypto/hashing/torrent code is very slow unoptimised.
opt-level = 2
